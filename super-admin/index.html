<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>Super Admin — Sistema de Pedidos</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef2f7;background:#0b0d10}*{box-sizing:border-box}body{margin:0;background:#0b0d10}.wrap{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:24px;background:#11151b;border-right:1px solid #232933}.brand{font-weight:800;font-size:20px;margin-bottom:28px}.nav button{display:block;width:100%;padding:12px;margin:5px 0;text-align:left;background:transparent;border:0;color:#aeb7c5;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#1c222b;color:#fff}.main{padding:28px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.muted{color:#8993a3}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#11151b;border:1px solid #232933;border-radius:16px;padding:18px}.metric{font-size:28px;font-weight:800;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,select{background:#0f1318;color:#fff;border:1px solid #303844;border-radius:10px;padding:11px 12px}button.primary{background:#f97316;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}button.ghost{background:#1b2129;color:#fff;border:1px solid #303844;border-radius:10px;padding:11px 15px;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #242a33;text-align:left}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#1c2521;color:#a8f0c0;font-size:12px}.login{max-width:420px;margin:10vh auto}.error{color:#ff8d8d;margin-top:10px}.hide{display:none}@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #232933}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.main{padding:16px}.grid{grid-template-columns:1fr}}
