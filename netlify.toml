[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin/admin.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/dev"
  to = "/dev/"
  status = 301

[[redirects]]
  from = "/dev/admin"
  to = "/dev/admin/admin.html"
  status = 200

[[redirects]]
  from = "/dono"
  to = "/dono/"
  status = 301
