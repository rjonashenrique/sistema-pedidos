<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos Pro • Cozinha</title><link rel="stylesheet" href="panel.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="panel.js"></script></head><body><header><div><span class="eyebrow">PEDIDOS PRO · OPERAÇÃO</span><h1>Painel da cozinha</h1><p id="storeLabel">Fila de produção</p></div><div class="header-actions"><span id="userLabel"></span><button id="refresh">Atualizar</button><button id="logout" class="secondary">Sair</button></div></header><main><section id="auth" class="panel"><h2>Entrar na cozinha</h2><form id="loginForm"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="authMsg" role="status"></p></section><section id="board" class="hidden"><div class="toolbar"><label>Loja<select id="storeSelect"></select></label><label>Mostrar<select id="filter"><option value="active">Em andamento</option><option value="all">Todos os pedidos recentes</option></select></label></div><div id="columns" class="columns"><section><h2>Recebidos</h2><div id="received" class="stack"></div></section><section><h2>Preparando</h2><div id="preparing" class="stack"></div></section><section><h2>Prontos</h2><div id="ready" class="stack"></div></section></div></section><p id="toast" class="toast" role="status"></p></main><footer>Pedidos Pro · Acesso conforme permissões da loja no Supabase.</footer></body></html>
