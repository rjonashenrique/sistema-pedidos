<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1430"><title>Cardápio online</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="brand" href="../plataforma/">Jonash.dev <small>Pedidos</small></a><span id="store-status" class="status">Carregando…</span></header><main class="wrap"><section class="store-hero"><div id="store-logo" class="logo">🍔</div><div><p class="eyebrow">CARDÁPIO ONLINE</p><h1 id="store-name">Carregando loja…</h1><p id="store-description" class="muted"></p><p id="store-address" class="muted"></p></div></section><div class="section-title"><div><h2>Nosso cardápio</h2><p class="muted">Escolha seus produtos e envie o pedido pelo WhatsApp.</p></div></div><div id="products" class="products"><p class="muted">Carregando produtos…</p></div><aside class="cart"><div><b id="cart-count">0 itens</b><span id="cart-total">R$ 0,00</span></div><button id="checkout" disabled>Enviar pedido pelo WhatsApp</button></aside><section id="checkout-panel" class="checkout hidden"><h2>Finalizar pedido</h2><div class="checkout-grid">
<label>Seu nome<input id="customer-name" required maxlength="100" autocomplete="name" placeholder="Como podemos te chamar?"></label>
<label>Seu WhatsApp (opcional)<input id="customer-phone" inputmode="tel" autocomplete="tel" placeholder="DDD + número"></label>
<label>Recebimento<select id="order-type"><option value="delivery">Entrega</option><option value="pickup">Retirada no local</option></select></label>
<label>Forma de pagamento<select id="payment-method"><option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option><option value="Cartão de crédito">Cartão de crédito</option><option value="Cartão de débito">Cartão de débito</option></select></label>
<label id="address-field" class="wide">Endereço para entrega<input id="customer-address" autocomplete="street-address" placeholder="Rua, número, bairro e referência"></label>
<label id="change-field" class="hidden">Troco para quanto?<input id="customer-change" inputmode="decimal" placeholder="Ex.: 50,00"></label>
<label class="wide">Observações<textarea id="customer-notes" rows="2" maxlength="500" placeholder="Sem cebola, ponto da carne, referência…"></textarea></label>
</div>
<div class="checkout-summary"><span>Produtos <b id="subtotal">R$ 0,00</b></span><span>Entrega <b id="delivery-fee">A calcular</b></span><span class="grand-total">Total <b id="checkout-total">R$ 0,00</b></span></div>
<button id="send-order">Confirmar e enviar pelo WhatsApp</button></section><p id="message" class="message" role="status"></p></main><footer>Cardápio digital por Jonash.dev</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/saas.js"></script><script src="../config/loja.js"></script><script src="app.js"></script></body></html>
