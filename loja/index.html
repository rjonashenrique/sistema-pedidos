<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="theme-color" content="#0b1430"><title>Loja online</title><style>
:root{--accent:#00c2ff;--bg:#081020;--panel:#111b31;--muted:#a5b3ca;--line:#263752}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f8fc;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px 16px 50px}.top{display:flex;align-items:center;gap:15px;padding:8px 0 18px}.logo{width:62px;height:62px;object-fit:cover;border-radius:16px;background:#1c2b44}.name{font-size:clamp(23px,4vw,34px);font-weight:800;letter-spacing:-.04em;margin:0}.muted{color:var(--muted);line-height:1.55}.banner{width:100%;max-height:300px;object-fit:cover;border-radius:20px;border:1px solid var(--line);margin:6px 0 18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.product{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden}.product img{width:100%;height:160px;object-fit:cover;background:#1a2941}.pbody{padding:14px}.product h2{font-size:17px;margin:0 0 7px}.desc{color:var(--muted);font-size:13px;min-height:36px;line-height:1.45}.price{font-weight:800;color:#78ffbe;font-size:18px;margin:12px 0}.btn{border:0;border-radius:10px;background:var(--accent);color:#041426;font-weight:800;padding:11px 14px;cursor:pointer;font:inherit}.btn.secondary{background:#1a2b47;color:#e8efff;border:1px solid #354866}.btn:disabled{opacity:.45}.qty{display:flex;align-items:center;gap:12px}.qty button{width:35px;height:35px;border-radius:9px;border:1px solid #40516d;background:#1a2942;color:#fff;font-size:20px;cursor:pointer}.notice{padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-align:center;margin-top:22px}.cart{position:sticky;bottom:10px;background:#172743;border:1px solid #3a5173;border-radius:15px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;box-shadow:0 8px 30px #0005}.cart small{display:block;color:#a9bad3}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:9px}.product img{height:120px}.pbody{padding:10px}.product h2{font-size:15px}.btn{font-size:14px;padding:10px}.desc{min-height:0}.cart{align-items:stretch;flex-direction:column}}
</style></head><body><main class="wrap"><div id="content"><div class="notice"><h2>Carregando loja…</h2><p class="muted">Só um instante.</p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/loja.js"></script><script src="storefront.js"></script></body></html>
